<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>股票短线精灵 · 原型</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0f1420; --card:#171e2e; --card2:#1d2638; --ink:#e8edf6; --sub:#93a1ba;
    --line:#2a3550; --brand:#3b82f6; --brand2:#22c55e; --warn:#f59e0b; --red:#ef4444; --green:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .app{max-width:1080px;margin:0 auto;padding:14px 14px 80px}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:6px 2px 12px}
  .logo{font-size:19px;font-weight:800;letter-spacing:.5px}
  .logo b{color:var(--brand)}
  .toggle{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .toggle button{background:transparent;border:0;color:var(--sub);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .toggle button.on{background:var(--brand);color:#fff}
  .search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .search input{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:7px}
  .card h3 .bar{width:4px;height:15px;background:var(--brand);border-radius:3px}
  .ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:10px}
  .ov .it{background:var(--card2);border-radius:10px;padding:10px}
  .ov .it .k{font-size:12px;color:var(--sub)}
  .ov .it .v{font-size:18px;font-weight:800;margin-top:2px}
  .up{color:var(--red)} .down{color:var(--green)}
  .chart{width:100%;height:300px}
  .chip-info{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--sub)}
  .chip-info b{color:var(--ink)}
  .news li{margin:6px 0;font-size:13px;color:var(--sub);list-style:none;padding-left:14px;position:relative}
  .news li:before{content:"▪";position:absolute;left:0;color:var(--brand)}
  .news a{color:var(--brand);text-decoration:none;font-size:11px;margin-left:6px}
  .dim{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:620px){.dim{grid-template-columns:1fr}}
  .dim .d{background:var(--card2);border-radius:10px;padding:11px}
  .dim .d .t{font-size:13px;font-weight:700;color:var(--brand);margin-bottom:4px}
  .dim .d .x{font-size:13px;color:var(--ink);line-height:1.55}
  .summary{background:linear-gradient(120deg,#1b2942,#1d2638);border:1px solid #2c3a5a;border-radius:12px;padding:13px;font-size:14px;font-weight:600;line-height:1.6}
  .strat{font-size:13.5px;color:var(--ink);line-height:1.7;white-space:pre-line}
  .fc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  @media(max-width:620px){.fc{grid-template-columns:1fr}}
  .fc .f{border-radius:10px;padding:11px;font-size:13px;line-height:1.5}
  .fc .b{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.4)}
  .fc .u{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4)}
  .fc .e{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4)}
  .fc .f .h{font-weight:700;margin-bottom:4px}
  .fc .b .h{color:#7eb0ff}.fc .u .h{color:#5be39a}.fc .e .h{color:#ff8a8a}
  .muted{color:var(--sub);font-size:12px;margin-top:8px}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:24px;line-height:1.7}
  .modelTag{font-size:11px;color:var(--sub);margin-left:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">📈 股票<b>短线精灵</b><span class="modelTag" id="modelTag">模型：hy3</span></div>
    <div class="toggle">
      <button id="btnHy3" class="on" onclick="setModel('hy3')">hy3</button>
      <button id="btnStep5" onclick="setModel('step5')">step5</button>
    </div>
  </header>

  <div class="search">
    <input id="inp" placeholder="输入股票代码或名称，如 600519 / 宁德时代" onkeydown="if(event.key==='Enter')doSearch()">
  </div>
  <div class="chips" id="chips"></div>

  <div class="card">
    <h3><span class="bar"></span>行情概览</h3>
    <div class="ov" id="ov"></div>
  </div>

  <div class="card">
    <h3><span class="bar"></span>K线 / 成交量</h3>
    <div id="kline" class="chart"></div>
  </div>

  <div class="card">
    <h3><span class="bar"></span>筹码峰（由K线+成交量自算 CYQ）</h3>
    <div id="chip" class="chart" style="height:240px"></div>
    <div class="chip-info" id="chipInfo"></div>
  </div>

  <div class="card">
    <h3><span class="bar"></span>资金面</h3>
    <div class="ov" id="fund"></div>
  </div>

  <div class="card">
    <h3><span class="bar"></span>重大消息</h3>
    <ul class="news" id="news"></ul>
  </div>

  <div class="card">
    <h3><span class="bar"></span>AI 短评 <span class="modelTag" id="reviewTag">hy3 生成</span></h3>
    <div class="dim" id="dims"></div>
    <div style="margin-top:12px"><div class="summary" id="summary"></div></div>
    <div style="margin-top:12px;font-weight:700;font-size:14px">短期应对策略</div>
    <div class="strat" id="strategy" style="margin-top:6px"></div>
    <div style="margin-top:12px;font-weight:700;font-size:14px">短期走势预测</div>
    <div class="fc" id="forecast"></div>
  </div>

  <div class="foot">
    原型演示 · 数据来自同花顺 iFinD（真实行情/资金/技术/消息），AI 短评由模型基于四维数据生成。<br>
    筹码峰由近期 K 线 + 成交量按 CYQ 模型自算。部署版将接入 iFinD REST/SDK + 可切换大模型（hy3/step5）。
  </div>
</div>

/* ============ 状态 ============ */
let state = { code:"600519", model:"hy3" };
let klineChart, chipChart;

/* ============ 工具 ============ */
function fmtCap(v){
  const a=Math.abs(v);
  if(a>=1e8) return (v/1e8).toFixed(2)+"亿";
  if(a>=1e4) return (v/1e4).toFixed(0)+"万";
  return v.toFixed(0);
}
function computeChip(kline){
  const arr=[...kline].reverse();
  let minL=Infinity,maxH=-Infinity;
  arr.forEach(d=>{minL=Math.min(minL,d.l);maxH=Math.max(maxH,d.h);});
  const N=40, step=(maxH-minL)/N, bins=new Array(N).fill(0);
  arr.forEach(d=>{
    const s=Math.max(0,Math.floor((d.l-minL)/step));
    const e=Math.min(N-1,Math.floor((d.h-minL)/step));
    const len=e-s+1, each=d.v/len;
    for(let i=s;i<=e;i++) bins[i]+=each;
  });
  const total=bins.reduce((a,b)=>a+b,0);
  const cur=kline[0].c;
  let profit=0,cost=0,w=0;
  bins.forEach((b,i)=>{
    const p=minL+(i+0.5)*step; cost+=b*p; w+=b;
    if(p<cur) profit+=b;
  });
  const points=bins.map((b,i)=>[+(minL+(i+0.5)*step).toFixed(2),+b.toFixed(0)]);
  return {points, profitRatio:+(profit/total*100).toFixed(1), avgCost:+(cost/w).toFixed(2), cur:+cur.toFixed(2)};
}

/* ============ 渲染 ============ */
function buildChips(){
  const box=document.getElementById("chips");
  box.innerHTML="";
  Object.keys(DATA).forEach(k=>{
    const s=DATA[k];
    const el=document.createElement("div");
    el.className="chip"+(k===state.code?" on":"");
    el.textContent=s.name+" "+k;
    el.onclick=()=>{state.code=k;render();};
    box.appendChild(el);
  });
}
function doSearch(){
  const q=document.getElementById("inp").value.trim();
  let hit=null;
  Object.keys(DATA).forEach(k=>{
    const s=DATA[k];
    if(k===q || s.code===q || s.name===q || s.name.includes(q) || k.includes(q)) hit=k;
  });
  if(hit){state.code=hit;document.getElementById("inp").value="";render();}
  else alert("原型内置样本：600519 贵州茅台 / 300750 宁德时代 / 002594 比亚迪 / 300059 东方财富。部署版接入 iFinD 后可查全市场。");
}
function setModel(m){
  state.model=m;
  document.getElementById("btnHy3").className=m==="hy3"?"on":"";
  document.getElementById("btnStep5").className=m==="step5"?"on":"";
  document.getElementById("modelTag").textContent="模型："+m;
  document.getElementById("reviewTag").textContent=m+" 生成";
  renderReview();
}
function render(){
  const s=DATA[state.code];
  // chips
  [...document.querySelectorAll(".chip")].forEach(c=>c.classList.remove("on"));
  // overview
  const chgCls=s.chg>=0?"up":"down", chgSign=s.chg>=0?"+":"";
  document.getElementById("ov").innerHTML=`
    <div class="it"><div class="k">名称</div><div class="v" style="font-size:16px">${s.name}</div></div>
    <div class="it"><div class="k">现价</div><div class="v">${s.price}</div></div>
    <div class="it"><div class="k">涨跌幅</div><div class="v ${chgCls}">${chgSign}${s.chg}%</div></div>
    <div class="it"><div class="k">PE(TTM)</div><div class="v">${s.pe}</div></div>
    <div class="it"><div class="k">PB</div><div class="v">${s.pb}</div></div>
    <div class="it"><div class="k">主力净流入</div><div class="v ${s.capital>=0?'up':'down'}">${s.capital>=0?'+':''}${fmtCap(s.capital)}</div></div>`;
  renderKline(s);
  renderChip(s);
  // fund
  const mc=s.macd;
  document.getElementById("fund").innerHTML=`
    <div class="it"><div class="k">主力净流入</div><div class="v ${s.capital>=0?'up':'down'}">${s.capital>=0?'+':''}${fmtCap(s.capital)}</div></div>
    <div class="it"><div class="k">MACD DIFF</div><div class="v ${mc.diff>=0?'up':'down'}">${mc.diff}</div></div>
    <div class="it"><div class="k">MACD DEA</div><div class="v ${mc.dea>=0?'up':'down'}">${mc.dea}</div></div>
    <div class="it"><div class="k">MACD 柱</div><div class="v ${mc.macd>=0?'up':'down'}">${mc.macd}</div></div>`;
  // news
  document.getElementById("news").innerHTML=s.news.map(n=>`<li>${n.t} <span style="color:var(--sub)">(${n.date})</span></li>`).join("");
  renderReview();
  // mark chip on
  document.querySelectorAll(".chip").forEach(c=>{ if(c.textContent.startsWith(s.name)) c.classList.add("on"); });
}
function renderKline(s){
  if(!klineChart) klineChart=echarts.init(document.getElementById("kline"));
  const arr=[...s.kline].reverse();
  const dates=arr.map(d=>d.d.slice(5));
  const ohlc=arr.map(d=>[d.o,d.c,d.l,d.h]);
  const vols=arr.map(d=>d.v);
  klineChart.setOption({
    grid:[{left:48,right:14,top:14,height:"62%"},{left:48,right:14,top:"72%",height:"20%"}],
    xAxis:[{type:"category",data:dates,axisLabel:{color:"#93a1ba",fontSize:10},axisLine:{lineStyle:{color:"#2a3550"}}},
           {type:"category",data:dates,gridIndex:1,axisLabel:{show:false},axisLine:{lineStyle:{color:"#2a3550"}}}],
    yAxis:[{scale:true,axisLabel:{color:"#93a1ba",fontSize:10},splitLine:{lineStyle:{color:"#1d2638"}}},
           {gridIndex:1,scale:true,axisLabel:{show:false},splitLine:{show:false}}],
    tooltip:{trigger:"axis"},
    series:[
      {type:"candlestick",data:ohlc,itemStyle:{color:"#ef4444",color0:"#22c55e",borderColor:"#ef4444",borderColor0:"#22c55e"}},
      {type:"bar",data:vols,xAxisIndex:1,yAxisIndex:1,itemStyle:{color:"#3b82f6"}}
    ]
  });
  klineChart.resize();
}
function renderChip(s){
  if(!chipChart) chipChart=echarts.init(document.getElementById("chip"));
  const c=computeChip(s.kline);
  const maxW=Math.max(...c.points.map(p=>p[1]));
  chipChart.setOption({
    grid:{left:56,right:14,top:14,bottom:28},
    xAxis:{type:"value",scale:true,axisLabel:{color:"#93a1ba",fontSize:10},splitLine:{lineStyle:{color:"#1d2638"}}},
    yAxis:{type:"value",axisLabel:{show:false},splitLine:{show:false}},
    tooltip:{trigger:"axis",formatter:p=>"成本价 "+p[0].axisValue+"<br>筹码量 "+p[0].data[1]},
    series:[{
      type:"bar",data:c.points,
      itemStyle:{color:p=>p.data[1]>maxW*0.6?"#f59e0b":"#3b82f6"},
      markLine:{symbol:"none",data:[{xAxis:c.cur,lineStyle:{color:"#ef4444",type:"solid"},label:{formatter:"现价 "+c.cur,color:"#ef4444",position:"end"}}]}
    }]
  });
  chipChart.resize();
  document.getElementById("chipInfo").innerHTML=
    `<span>获利比例 <b style="color:${c.profitRatio>50?'#22c55e':'#f59e0b'}">${c.profitRatio}%</b></span>`+
    `<span>平均成本 <b>${c.avgCost}</b></span>`+
    `<span>现价 <b>${c.cur}</b></span>`+
    `<span class="muted">柱越高=该价位筹码越密集；红柱为高位密集区</span>`;
}
function renderReview(){
  const s=DATA[state.code];
  const r = state.model==="step5" && s.reviewStep5 ? s.reviewStep5 : s.review;
  const dims=[
    {t:"① 筹码峰",x:r.chip},
    {t:"② 资金面",x:r.fund},
    {t:"③ K线 / 技术",x:r.tech},
    {t:"④ 重大消息",x:r.news}
  ];
  document.getElementById("dims").innerHTML=dims.map(d=>`<div class="d"><div class="t">${d.t}</div><div class="x">${d.x}</div></div>`).join("");
  document.getElementById("summary").textContent="综合短评："+r.summary;
  document.getElementById("strategy").textContent=r.strategy;
  document.getElementById("forecast").innerHTML=
    `<div class="f b"><div class="h">基准情景</div>${r.forecast.base}</div>`+
    `<div class="f u"><div class="h">乐观情景</div>${r.forecast.bull}</div>`+
    `<div class="f e"><div class="h">悲观情景</div>${r.forecast.bear}</div>`;
}

render();
window.addEventListener("resize",()=>{if(klineChart)klineChart.resize();if(chipChart)chipChart.resize();});
